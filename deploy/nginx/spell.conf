# nginx in front of every MOD's app on one port (compose service "proxy", profile "proxy").
#
# A load balancer sends all SPELL hostnames to port 80 of the instance; this picks the MOD's
# container from the Host header. Upstreams are looked up per request through Docker's DNS,
# so recreating an app container (./spellctl start) or not running a MOD never breaks the
# proxy: a MOD that is down answers 502.
#
# Edit this file on the host, then: ./spellctl proxy reload

resolver 127.0.0.11 valid=10s ipv6=off;

# Hostname -> app container. Matching on the prefix keeps the same file working for any
# domain (sgd-spell.alliancegenome.org, sgd-spell.example.org, ...).
map $host $spell_app {
    ~^sgd-spell\.   spell-sgd;
    ~^wb-spell\.    spell-wb;
    default         "";
}

# Keep the scheme the client used at the load balancer (it terminates HTTPS).
map $http_x_forwarded_proto $spell_proto {
    default  $http_x_forwarded_proto;
    ""       $scheme;
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 10m;    # gene lists posted to /api/search
    proxy_read_timeout 300s;     # large GO enrichments and searches

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $spell_proto;

    # Load balancer health checks send the instance IP as Host, so each MOD gets its own
    # path: target group health check path /health/sgd or /health/wb.
    location = /health/sgd {
        set $health_app spell-sgd;
        proxy_pass http://$health_app:8000/api/info;
        access_log off;
    }
    location = /health/wb {
        set $health_app spell-wb;
        proxy_pass http://$health_app:8000/api/info;
        access_log off;
    }

    location / {
        if ($spell_app = "") {
            return 404;
        }
        proxy_pass http://$spell_app:8000;
    }
}
