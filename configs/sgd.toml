# spell-next config for SGD. Copy to <raw data dir>/mod.toml.
# Paths are relative to the raw data directory.

[mod]
id = "SGD"
name = "Saccharomyces Genome Database"
site_title = "SPELL next"
organism = "yeast"
species = "S. cerevisiae"           # home page: "enter a set of S. cerevisiae gene names"
contact = "sgd-helpdesk@lists.stanford.edu"
examples = ["ACT1", "GAL1", "HSP104", "RPL3 RPL4A RPS2 RPS3", "CDC28 CLN1 CLN2 CLB5 CLB6"]
listing_example = "GAL1 GAL7 GAL10"

[links]
# Placeholders: {mod_id}, {systematic}, {standard}
gene = "https://www.yeastgenome.org/locus/{mod_id}"
# Keyword pages; placeholders: {format_name}, {name}
keyword = "https://www.yeastgenome.org/keyword/{format_name}"

[genes]
# downloads.yeastgenome.org/curation/chromosomal_feature/SGD_features.tab
file = "meta/SGD_features.tab"
format = "sgd_features"
default_species = "Saccharomyces cerevisiae"

[datasets]
# Export of SPELL's MySQL datasets table (SQLdump*_fordownloadfiles.txt). New datasets
# can instead be listed in a table: format = "dataset_table" (see README).
metadata = "meta/SQLdump2023_fordownloadfiles.txt"
format = "spell_dump"
# SGD keywords (display_name, category, description, format_name): the tag vocabulary,
# grouped by category in the tag picker; validate warns about tags not in it.
keywords = "meta/keywords.csv"

[go]
obo = "meta/go-basic.obo"
gaf = ["meta/gene_association.sgd.gaf.gz"]

[updates]
# Reference files refreshed by `spell update-refs` (weekly via `spellctl update sgd` from cron).
# Paths are relative to the raw data directory; a file is replaced only if its download passes checks.
"meta/SGD_features.tab" = "https://downloads.yeastgenome.org/curation/chromosomal_feature/SGD_features.tab"
"meta/go-basic.obo" = "https://purl.obolibrary.org/obo/go/go-basic.obo"
"meta/gene_association.sgd.gaf.gz" = "https://downloads.yeastgenome.org/curation/literature/gene_association.sgd.gaf.gz"
