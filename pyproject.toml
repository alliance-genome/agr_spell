[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spell-next"
version = "0.1.0"
description = "Prototype replacement for SPELL query-driven co-expression search"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "fastapi>=0.110", "uvicorn[standard]>=0.29"]

[project.scripts]
spell = "spell_next.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pyflakes>=3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
spell_next = ["static/*"]
